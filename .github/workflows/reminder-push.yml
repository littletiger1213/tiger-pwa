name: 虎头虎脑提醒推送

# 放在云端的原因：iPhone 会冻结后台网页的 JS，工作台关着就推不了。
# 本任务每 5 分钟跑一次，读仓库里的订阅源 ICS，替工作台把提醒推到手机（Bark）。
# 公开仓库的标准 runner 不计费。

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: '填 1 则只发一条测试推送（不读日程）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: hutou-reminder
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 推送提醒并回写状态
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          PUSH_TEST: ${{ inputs.test }}
        run: |
          python .github/scripts/reminder_push.py
          if [ -n "$(git status --porcelain .github/state)" ]; then
            git config user.name hutou-bot
            git config user.email hutou-bot@users.noreply.github.com
            git add .github/state
            git commit -m "chore(reminder): 更新去重状态 [skip ci]"
            # 工作台保存时会往 main 推 ICS，可能正好撞上 → 拉取后重试，避免状态丢失导致重复推送
            for i in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase --autostash origin main || true
              sleep 3
            done
          fi
